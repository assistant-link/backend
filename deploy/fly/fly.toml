# Fly.io template. Copy it to the repository root as fly.toml, replace every <placeholder>, then follow
# deploy/SELF_HOSTING.md.
app = '<your-app-name>'
primary_region = '<region>'
kill_signal = 'SIGTERM'
# Lets active voice calls end before a deploy stops the machine.
kill_timeout = '5m'

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = '<your-app-name>.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when no requests or connections are open; open WebSockets keep the machine running.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

# Voice calls (see deploy/SELF_HOSTING.md): a dedicated IPv4, WEBRTC_LISTEN_HOST = 'fly-global-services',
# WEBRTC_PUBLIC_IP and WEBRTC_PORT_RANGE in [env], min_machines_running = 1, and one block like this per port.
#
# [[services]]
#   protocol = 'udp'
#   internal_port = 50000
#
#   [[services.ports]]
#     port = 50000

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
